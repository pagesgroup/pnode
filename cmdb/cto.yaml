template:
  properties:
    properties_product: &properties_product
      # Product
      product_name:
        legend: 🪣 Product
      pail_size:
      pail_shape:
        defaultValue: Round
        options:
          - title: Round
            img: /assets/images/prod/shape-round.png
          - title: Oval
            img: /assets/images/prod/shape-oval.png
          - title: Square
            img: /assets/images/prod/shape-square.png
          - title: Rectanglar
            img: /assets/images/prod/shape-rect.png
      pail_height:
        unit: mm
        min: 160
        max: 360
      pail_diameter:
        unit: mm
        min: 160
        max: 330
      pail_width:
        unit: mm
        min: 160
        max: 390
      pail_length:
        unit: mm
        min: 0
        max: 300
      pail_datasheet:
    properties_config: &properties_config
      artnr:
        legend: Configuration
        options:
          - value: 900001 # BM
            title: BM
          - value: 900007 # BME
            title: BME
          - value: 900002 # BMF
            title: BMF
          - value: 900003 # BPBS
            title: PBS
          - value: 900004 # PBSB
            title: PBSB
          - value: 900005 # PBM
            title: PBM
          - value: 900010 # BMM
            title: BMM
          - value: 900011 # MH-BMF
            title: MHBMF
          - value: 900012 # MH-PBS
            title: MHPBS
          - value: 900013 # MH-PBSB
            title: MHPBSB
          - value: 900014 # MH-PBM
            title: MHPBM
          - value: 900101 # PLE
            title: PLE
          - value: 900102 # PLEA
            title: PLEA
          - value: 900103 # PLD
            title: PLD
      model:
        legend: Configuration
        options:
          - &prop_s
            value: S 
            title: Standard
            items:
              - Cycletime 5.0 seconds or more per pail
          - &prop_sp
            value: SP 
            title: Plus
            artnr: 901001
            items:
              - Cycletime 3.8 seconds or more per pail
              - Voorcentreren
          - &prop_hp
            value: HP 
            title: High Performance
            artnr: 901002
            items:
              - Cycletime 2.5 seconds or more per pail
              - Voorcentreren
              - High speed doorzetten
      size:
        legend: Configuration
        defaultValue: 05
        options:
          - value: '05' 
            title: Max width n mm
          - value: '10' 
            title: Max width n mm
          - value: '20' 
            title: Max width n mm
      control_cabinet_type: &control_cabinet_type
        legend: Configuration
        title: Cabinet Type
        options:
          - value: CE
            title: Power supply 230 - 400V / 50Hz
          - value: UL
            artnr: 901051
            title: Power supply 480V 3 phase + PE 60 Hz
      control_cabinet_safety: &control_cabinet_safety
        legend: Configuration
        title: Cabinet Safety
        options:
          - title: Standard
          - title: Split power/control cabinet
            artnr: 901052 # Gescheiden kast variant
      operation_side:
        options:
          - title: Right side operation
            value: R
            items:
              - Right sided HMI
              - Right sided Control Cabinet
              - Right sided Reject Exit
          - title: Left side operation
            value: L
            items:
              - Left sided HMI
              - Left sided Control Cabinet
              - Left sided Reject Exit
      door_type:
        options:
          - title: Swing doors
            description: Daar waar mogelijk worden draaideuren gebruikt
          - title: Sliding doors
            artnr: 901022
            description: Daar waar mogelijk worden draaideuren vervangen voor schuifdeuren          
    properties_handle_metal: &properties_handle_metal
      handle_material:
        legend: 🪣 Product
        defaultValue: Metal
      handle_art:
      handle_shape:
        defaultValue: Round
        options:
          - title: Round
            img: /assets/images/prod/beugel-t4.png
          - title: Round Pin
            img: /assets/images/prod/beugel-t5.png
          - title: Grip Round
            img: /assets/images/prod/beugel-t3.png
          - title: Grip 4H
            img: /assets/images/prod/beugel-t1.png
          - title: Grip 6H
            img: /assets/images/prod/beugel-t2.png
          - title: Grip Wide
            img: /assets/images/prod/beugel-t6.png
            descrition: kdfjgh dkfhg sdjfgsdjfhgs dfgkshdjkgf lskdfgksdk
            mat:
              - art: A35347623 
                qnt: 
                price: 3000
      handle_width:
        unit: mm
        min: 2.6
        max: 4.4
      handle_length:
        unit: mm
        min: 380
        max: 720
      handle_diameter:
        unit: mm
        max: 400
        min: 200
      handle_datasheet:
      grip_shape:
        options:
          - title: Metal
          - title: Plastic
      grip_diameter:
        unit: mm
        min: 8
        max: 10
      grip_length:
        unit: mm
        min: 70
        max: 80
      handle_grip_application:
        legend: Machine configuration
        # title: Griprol feeder
        title: Handle Grip application
        defaultValue: Included
        options:
          - title: Special grip feeder due to dimensions
            description: Er is een trilvuller aanwezig voor de aanvoer van de griprol.
              Optie is standaard aan. Maar als geen griprol nodig is kan deze worden verwijderd.
      griprol_detection:
        title: Griprol detection
        description: Griproldetectie(vormstation) Letica/Amcor US. Optie aan eind basisplaat.
          Extra controle of griprol niet is verloren.
    properties_handle_plastic: &properties_handle_plastic
      handle_material:
        defaultValue: Plastic
      handle_shape:
        defaultValue: Round
      handle_width:
        unit: mm
      handle_length:
        unit: mm
      handle_datasheet:
    properties_lid: &properties_lid
      product_name:
      lid_size:
      lid_shape:
        legend: 🪣 Product
        defaultValue: Round
        options:
          - title: Round
            img: /assets/images/prod/shape-round.png
          - title: Oval
            img: /assets/images/prod/shape-oval.png
          - title: Square
            img: /assets/images/prod/shape-square.png
          - title: Rectanglar
            img: /assets/images/prod/shape-rect.png
      lid_height:
        unit: mm
        min: 0
        max: 300
      lid_diameter:
        unit: mm
        min: 0
        max: 300
      lid_datasheet:
    # properties_test: &properties_test
    #   product_test:
    #     title: Testen
    #     defaultValue: No
    #     decription: Product wordt op lactie Polymac getest op de machine
    #   product_set:
    #     title: Wisselset
    #     defaultValue: No
    #     decription: Er wordt een wisselset meegeleverd voor het product
    #   product_optional:
    #     title: Optioneel
    #     defaultValue: No
    #     decription: De machine moet in de toekomst geschikt gemaakt kunnen worden voor het product
    properties_project: &properties_project
      packing:
        legend: General
        options: 
          - title: Excluded
          - title: Included
          - title: Skid packing and stowing for ocean freight, incl. VGM and EX/A document.
      warranty:
        legend: General
        options: 
          - title: 12 months warranty after installation. 
          - title: 24 months warranty after installation. 
          - title: 36 months warranty after installation. 
      installation:
        options: 
          - title: Excluded
          - title: Included
      training:
        options: 
          - title: Excluded
          - title: Included
      shipping:
        options: 
          - title: Excluded
          - title: Included
    properties_frame: &properties_frame
      # Mechanical
      base_frame:
        legend: Mechanical
        defaultValue: Welded steel 
      color_frame:
        legend: Mechanical
        options:
          - title: White (RAL 9003)
          - title: Custom
      color_plating:
        legend: Mechanical
        options:
          - title: White (RAL 9003)
          - title: Custom
      # Cycle time:
      #   defaultValue: 6 sec		
    properties_base: &properties_base
      # Performance
      <<: *properties_frame
      # Dimensions
      floor_area:
        legend: Dimensions
        description: without roller conveyor
        defaultValue: 2.700 x 1.210 mm
      maximum_machine_height:
        defaultValue: 2.450 mm
      outfeed_roller_conveyor:
        defaultValue: 1.500 mm
      belt_height:
        defaultValue: ± 600 mm
        description: from ground (feed-through)
      weight:
        defaultValue: ± 1.500 kg
      # Configuration
      centering:
        title: Centering
        defaultValue: Included
      oval_centering:
        title: Oval product
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901020
      top_cover:
        legend: Configuration
        description: De machine wordt daar waar mogelijk voorzien van afscherming aan de bovenkant.
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901039
      machine_led_lighting:
        description: LED verlichting in de machine
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
      # Product transport
      pails:
        options:
        - title: Must be brought to the machine bottom down

      infeed_conveyor:
        legend: Configuration
        title: Infeed conveyor
        description: Invoerband. Lengte is standaard 1500 mm. 
          Kan eventueel opgegeven worden door de klant.
        options:
          - title: None
          - title: Conveyor belt
            artnr: 901015
            description: Driven in-feed conveyor, 1500mm
          - title: Roller conveyor
            description: Non-driven in-feed rollerveyor with a length of max. 1.500 mm. 
              Additionally the guiderail will be bend to guide the products 
              from the lift table to the infeed direction of the handle fitting machine.
              Bestaat dez eoptie?
      product_step:
        defaultValue: 450
        options:
        - value: 400
          title: Max diameter < 400
        - value: 450
          title: Max diameter < 450
      product_stepping:
        legend: Product transport
        title: Product stepping
        # defaultValue: Step motor driven conveyor belt for pail transport
        options:
          - title: Beld driven
            description: Doorzetten emmers door band doordraaien.
          - title: Forced shift forward
            # title: Pail transport Servo driven
            description: Emmertransport door de machine middels aangedreven doorzet mechanisme.
              Is vereist op een HP machine in verband met de snelheid.
      product_outfeed:
        legend: Product transport
        # defaultValue: Roller conveyor
        options:
          - title: Roller conveyor Straight
            description: Roller conveyor of 1.500 mm length
          - title: Roller conveyor Right
          - title: Roller conveyor Left
          - title: Driven conveyor
          - title: Excluded
          - title: Custom
            description:
      reject_outfeed:
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Reject Roller conveyor
            description: The rejects will be buffered on a rollerveyor instead of 
              being dropped on the ground, 
              length 1.000 mm.
      # Stacking
      stacker:
        description: Integrated in system
        # defaultValue: Stacker
        options:
          - title: Stacker
            description: Koud in warm (pneum.)
          - title: Turn Stacker
            description: Draai stapelaar (vereist bij HP variant)
          - title: None
          # - title: Twin Stacker
          #   description: Koud in warm HP Twin stacker(servo)
      stacking_type:
        defaultValue: Cold in warm (pneumatic)
      stacking_height:
        defaultValue: Max 1.400 mm (standard)
        
      # Inspection
      cwl_detection:
        legend: Configuration
        title: CWL detection
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901048
            description: Child Warning Label detection.
      dot_matrix_barcode_reader:
        legend: Configuration
        title: Dot Matrix Barcode Reader
        description: CWL detection is standard. An extra dot matrix / barcode reader is added for orientation and
          Program for reject/accept IML.
        description1: Een Data Matrix Camera die de matrix controleerd of deze wel correct is.
          Alleen Goed/Fout controle.
          Geen data vergelijking.
        options:
          - title: Excluded
          - title: Included
            artnr: 901049

      code_reader:
        legend: Optional
        # defaultValue: No
        description: An extra dot matrix / barcode reader is added
          for orientation and Program for reject/accept IML.
        options:
          - title: Excluded
          - title: Included
      vision_inspection:
        description: Buiten machine Hildering. Ronde emmer. Custom. Spot detectie > 2.5 Gallon. 
          Pas op kind in emmer. 
          CWL detectie.
        options:
          - title: Excluded
          - title: Included
      vision_inspection_prep:
        description: To have the machine prepared to be able to work with a vision system, but not include it yet.
        options:
          - title: Excluded
          - title: Included

      led_lighting:
        legend: Configuration
        # defaultValue: Excluded
        options: 
          - title: Excluded
          - title: Included
            description: LED lighting in machine
      # colorsensor_preperation:

      # Safety
      safety_doors:
        legend: Configuration
        # defaultValue: Unlocked
        options: 
          - title: Standard unlocked
          - title: Lockable doors
            description: Doors need to be unlocked before opening
              if the system is in an undefined situation 
              special security level is required before opening 
      safety_counter_weight:
        legend: Configuration
        # defaultValue: No
        options: 
          - title: Exclude
          - title: Included
      # Interfaces
      language:
        legend: Controls
        # defaultValue: English
        options:
          - title: English
            value: EN
          - title: German
            value: DU
          - title: Nederlands
            value: NL
          - title: French
            value: FR
          - title: Polish
            value: PL
          - title: Spanisch
            value: ES

      dual_operation:
        legend: Configuration
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901011
            description: The machine will be provided with a HMI on both sides.
              # Een extra HMI wordt aan de linkerzijde van de machine geplaatst.
              # De machine kan aan 2 zijden worden bediend.
      single_power_outlet:
        legend: Configuration
        options:
          - title: Excluded
          - title: Single power outlet 110V outside main control panel
      internet_connection:
        legend: Configuration
        title: Internet Connection
        # art: internet_connection
        description: This enables us to review the condition of the Handle Fitting machine 
          in case any first line service or support is required.
        defaultValue: 1
        options:
          - title: Excluded
          - title: Included
            artnr: 901046

      upstream_interface:
        legend: Controls
        options:
          - title: Signaal <> Upstream app. (K25)
      # Controls
      control_cabinet_cooling:
        legend: Controls
        title: Control Cabinet Cooling
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901024
            description: Watercooled for Hot Environments or IML
      control_type:
        defaultValue: 1
        options:
          - title: SAIA
          - title: Rockwell
      # Resources
      air_supply:
        legend: Resources
        title: Air Supply
        defaultValue: Minimum 6 bar (maximum 8 bar)
      air_consumption:
        legend: Resources
        title: Air Consumption
        defaultValue: 44 m³/h (4.3 sec / cycle)
      power_consumption:
        defaultValue: 3.5 kWh (4.3 sec / cycle)
      operating_temperature:
        defaultValue: 10°C - 40°C
      noise_level:
        defaultValue: 75 dB(A), peak 88 dB(A) at compressed air exhaust from pneumatic equipment
      # Finishing
      quality_level:
        # defaultValue: A
        options:
          - title: A
            items:
              - Default
          - title: B
            items:
              - Lift cilinders met slag 100mm
              - Motor van Servoband afschermen
              - Spindelverstelling stapelaar tbv. intern transport
              - Rollenbaan; breedte product/lengte rollen en aantal rollen controleren, lengte tot einde afscherming, geen eindaanslag!
                  Altijd stalen rollen(m.i.v. 12-09-19)
              - Nordlock ringen; toepassen bij delen welke gelijk aan of boven het niveau van het product zitten en waar er een risico is dat er een bout/ring/moer in het product kan vallen.
              - Metaalhoudende Ty-wraps toepassen
      <<: *properties_project
    properties_bm: &properties_bm
      wire_seperation:
        legend: Machine configuration
        title: Wire separation
        defaultValue: Unscrambling function
      handle_side_selection:
        title: Handle Side Selection
        description: Handel altijd aan juiste zijde. 
          vereist een identificatie methode als de emmer rond is identiek van vorm. 
          Er moet bepaald worden aan welke zijde het label zit.
          Er verschillende methoden om te bepalen waar het etiket zit.
          Dit kan met vision of een sensor als de emmer niet symetrisch is. 

          Heet ook wel Omrollen. 
          Afhankelijk van product. 
          PBS/PBM. Wel/niet nodig.
          te bepalen tijdens offerte fase. Wat zijn prijs consequenties.
        options:
          - title: Excluded
          - title: Included
            artnr: 901012
      handle_infeed:
        defaultValue: Magazine for straight pre-cut handles
      handle_assembly:
        defaultValue: After pre-centring
      # grip_assembly:
      #   defaultValue: Grip integration
      #   options:
      #     - title: Included
      #     - title: Excluded
      #       artnr: 901010
      grip_detection:
        description: Griprol aanwezigheid detectie
        defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 901033
      knob_presence_detection:
        description: Controle of knop aanwezig is
        defaultValue: Included
      knob_quality_inspection:
        title: Knob inspection
        description: Keyence vision camera om te kijken of de knop aan de hendel wel goed gevormd is.      
      # knob_quality:
        defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            description: Vison Knob quality check.
            artnr: 901031
system:
  properties:
    <<: *properties_config
  row:
    products: []

articles:
  - artnr: 900001 # BM
    descr: The Polymac basic installation for the handle fitting and forming of a single pail and handle product. Size starting at 10L. #iets roepen mbt de wire diameter?
    type: bm
    description: Metal Handle Forming and Fitting Machine Standard
    img: /assets/images/art/bm-12.png
    datasheets:
      - title: BM-S-Layout-EN.pdf
        href: /assets/images/art/layout/A210635-BM-S-Layout-EN.pdf
      - title: BM-HP-Layout-EN.pdf
        href: /assets/images/art/layout/A236182-BM-HP-Layout-EN.pdf
    properties:
      <<: *properties_config
      <<: *properties_base
      # <<: *properties_test
      cooling_water:
        legend: Resources
        description: Cooling for hydraulik unit
        defaultValue: Cooling water In/Out 2-3 Bar
    sbs:
      img: /assets/images/art/sbs/dia1.png
  - artnr: 900007 # BME
    type: bme
    description: Metal Handle Forming and Fitting Machine Economic
    img: /assets/images/art/bm-12.png
    properties:
      <<: *properties_config
      # <<: *properties_test
      <<: *properties_base
      <<: *properties_project
  - artnr: 900002 # BMF
    descr: Polymac Metal Handle Form and Fitting Flex solution for a variaty in pail and handle sizes round and rectangular up to 20L
    type: bmf
    description: Metal Handle Form and Fitting Machine Flex
    img: /assets/images/art/bmf-12.png
    properties:
      <<: *properties_config
      # <<: *properties_test
      <<: *properties_base
      <<: *properties_project
    sbs:
      img: /assets/images/art/sbs/dia2.png
  - artnr: 900003 # PBS
    descr: Polymac dedicated Plastic handle fitting machine for single type plastic strip handles.
    type: pbs
    description: Plastic Handle Fitting Machine Strip
    img: /assets/images/art/pbs-12.png
    properties:
      <<: *properties_config
      model:
        legend: Configuration
        defaultValue: S
        artnr: 903000
        options:
          - value: S 
            title: Standard
            items:
              - Cycletime 5.0 seconds or more per pail
          - value: SP 
            title: Plus
            artnr: 903001
            items:
              - Cycletime 3.8 seconds or more per pail
              - Voorcentreren
          # - value: HP 
          #   title: High Performance
          #   artnr: 903002
          #   items:
          #     - Cycletime 2.5 seconds or more per pail
          #     - Voorcentreren
          #     - High speed doorzetten
      # <<: *properties_test
      <<: *properties_base
      <<: *properties_project
      handle_push:
        legend: Configuration
        title: Tight around the rim
        # defaultValue: Excluded
        options:
          - title: Excluded
          - title: Included
            artnr: 903003
            description: Omrollen, Aandrukken plastic strip beugel 
              zodat deze netjes rond de emmer gaat zitten
              Alleen bij PBS avraint en vereist als de beugel strak om de emmer zit 
              en niet vanzelf om de emmer valt.
      handle_infeed_buffer:
        legend: Configuration
        # defaultValue: Default
        options:
          - title: Excluded
          - title: Included
            artnr: 901037
            description: Buffer band. The Buffer conveyor creates extra buffer capacity 
              for inserting Handle-strips into the magazine 
              for about 350 extra handles.
    sbs:
      img: /assets/images/art/sbs/dia3.png
  - artnr: 900004 # PBSB
    descr: Polymac Plastic Handle Fitting solution for fixed preformed plastic handles.
    type: pbsb
    description: Plastic Handle Fitting Machine Fixed
    img: /assets/images/art/pbsb-12.png
    properties:
      <<: *properties_config
      # <<: *properties_test
      <<: *properties_base
      <<: *properties_project
    sbs:
      img: /assets/images/art/sbs/dia4.png
  - artnr: 900005 # PBM
    descr: Polymac Plastic Handle Fitting machine with Mat infeed. Handles are cut out of the mat and fitted to the pail.
    type: pbm
    description: Plastic Handle Fitting Machine Mat
    img: /assets/images/art/pbm-12.png
    properties:
      <<: *properties_config
      # <<: *properties_test
      <<: *properties_base
      <<: *properties_project
    sbs:
      img: /assets/images/art/sbs/dia5.png
  - artnr: 900010 # BMM
    descr: Polymac modular Handle fitting solution base frame on which you can install our different metal and plastic modules. Change time in under fifteen minutes.
    type: bmm
    description: Modular Handle Fitting Machine Base
    img: /assets/images/art/bmm-12.png
    datasheets:
      - title: BMM-Layout-EN.pdf
        href: /assets/images/art/layout/A272317-BMM-Layout-EN.pdf
    properties:
      <<: *properties_config
      model:
        legend: Configuration
        # defaultValue: S
        artnr: 900001
        options:
          # - value: S 
          #   title: Standard
          #   items:
          #     - Cycletime 5.0 seconds or more per pail
          - value: SP 
            title: Plus
            artnr: 901001
            items:
              - Cycletime 3.8 seconds or more per pail
              - Voorcentreren
          - value: HP 
            title: High Performance
            artnr: 901002
            items:
              - Cycletime 2.5 seconds or more per pail
              - Voorcentreren
              - High speed doorzetten
      <<: *properties_base
      <<: *properties_project
    sbs:
      img: /assets/images/art/sbs/dia6.png
  - artnr: 900011 # MH-BMF
    descr: Polymac Metal Handle Fitting module to be installed on our BMM Modular Handle en Fitting base. Single product fitting use of metal handles up to 4.3mm.
    type: mhbmf
    description: Metal Handle Form and Fitting Module
    img: /assets/images/art/bmm-bmf-12.png
    datasheets:
      - title: MH-BMF-Layout-EN.pdf
        href: /assets/images/art/layout/A252667-MH-BMF-Layout-EN.pdf
      - title: BMM-Layout-EN.pdf
        href: /assets/images/art/layout/A269556-BMM-MH-BMF-Layout-EN.pdf
    properties:
      <<: *properties_config
      # <<: *properties_test
      <<: *properties_frame
      <<: *properties_project
    sbs:
      img: /assets/images/art/sbs/dia7.png
  - artnr: 900012 # MH-PBS
    descr: Polymac Plastic Handle Fitting module to be installed on our BMM Modular Handle en Fitting base. Single product fitting use of plastic strip only handles.
    type: mhpbs
    description: Plastic Handle Fitting Machine Strip Module
    img: /assets/images/art/bmm-pbs-01.png
    properties:
      # <<: *properties_test
      <<: *properties_frame
