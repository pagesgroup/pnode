templates:
  parameter:
    - &axis
      properties:
        position:
          unit: mm
        speed:
          unit: mm/s
        accelaration:
          unit: mm/s2
        deaccelaration:
          unit: mm/s2
        jerk:
          unit: '%'
        homing:
    - &locking_device
      swtag: dSts_LockingDevice
      data_type: DINT
      description: "ID number of the device whereby the control module is locked. 0 = unlocked"
  command:
    # Pneumatiek
    # Motor
    - &on
      hmi: On
    - &off
      hmi: Off
    - &release
      hmi: Release break
    - &stop
      hmi: Stop
    - &home
      hmi: Home
  input:
    - &no_end
      hmi: No end feedback
    - &no_start
      hmi: No start feedback
    - &btn_start2 # HMI 2 Drukknop "Machine Start"
      tag: MBE-S6
      nl: HMI 2 - Drukknop "Start machine"
      en: push-button open door
      de: Druckknopf Offen Tür
      fr: bouton poussoir ouvert porte
    - &sw_auto2 # HMI 2 Sleutelschakelaar "Hand/Auto"
      tag: MBE-S7
      nl: HMI 2 - Sleutelschakelaar "Hand/Auto"
      en: Keyswitch hand / automatic operating side
      de: Schlüßelschalter Hand / Auto Bedienseite
      fr: Interrupteur de clé main / automatique côté commande
  status:
    - name: Undefined
    - name: Aborting # 1
    - name: Aborted # 2
    - name: Clearing
    - name: Stopping
    - name: Stopped
    - name: Resetting
    - name: Idle
    - name: Starting
    - name: Execute # Running
    - name: Completing
    - name: Completed
    - name: Holding
    - name: Held
    - name: Unholding
    - name: Suspending # Pausing
    - name: Suspended # Paused
    - name: Unsuspending # Un-pausing

    - &iotest
      swtag: bSts_IOtest
      hmi: Ok
      description: "IO test is active"

    - &moving
      swtag: bSts_Moving
    - &homed
      swtag: bSts_Homed
    - &enabled
      swtag: bSts_Enabled
  cm:
    - &par_axis_par
      distance:
        type: number
      speed:
        type: number
      accelaration:
        type: number
      decelaration:
        type: number
      jerk:
        type: number
      homing:
        type: number

    - &cm_do
      btn: btn-push
      parameter: &do_par
        - &time_out
          swtag: dTimeout
          # name: time_out
          en: Time out
          unit: ms
          data_type: DINT
        - &activate_time
          swtag: dActivateDelayTime
          en: Activate time
          data_type: DINT
          unit: ms
          description: denotes the time the cylinder needs to reach his activated state (= end position)
        - &deactivate_time
          swtag: dDeactivateDelayTime
          en: Deactivate time
          unit: ms
        - &on_delay_time
          swtag: dOnDelayTime
          en: On delay time
          unit: ms
        - &off_delay_time
          swtag: dOffDelayTime
          en: Off delay time
          unit: ms
        - &do_profile
          swtag: dCfg_DoIOProfile
          data_type: DINT
          description: IO profile configuration
          options:
            - Start feedback
            - End feedback
            - Activate output
            - Deactivate output
            - On delay
            - Off delay
      command: &do_cmd
        - &activate
          swtag: bCmd_Activate
          en: Activate
          data_type: BOOL
          description: "Command to activate the output or cylinder (forward, from Start to End sensor)"
        - &deactivate
          swtag: bCmd_Deactivate
          en: Deactivate
          ch: deactivate
        - &pressure_less
          swtag: bCmd_Pressureless
          data_type: BOOL
          name: pressure_less
          hmi: Pressure less
          description: "Command pressureless"
        - &pressure_both
          swtag: bCmd_PressureBoth
          data_type: BOOL
          name: pressure_both
          hmi: Pressure both
          description: "Command to set pressure on both sides of the cylinder"
      input:
        - &feedback_end
          swtag: bInp_EndFeedback.bInput_State
          # data_type: UDT_Input_Structure
          en: Feedback end
          # di: TBD
          # ch: end_fb
          description: "Start feedback input state and IO number"
        - &feedback_start
          swtag: bInp_StartFeedback.bInput_State
          # data_type: UDT_Input_Structure
          en: Feedback start
          # di: TBD
          # ch: start_fb
          description: "End feedback input state and IO number"
      output:
        - &active
          swtag: bOut_Activate.bOutput_State
          en: Active
          <<: *vj
        - &deactive
          swtag: bOut_Deactivate.bOutput_State
          en: Deactive
      status: &do_sts
        - &activated
          en: Activated
          swtag: bSts_Activated
          description: "Status is true when the output is activated, cylinder is forward and End sensor is on"
        - &deactivated
          swtag: bSts_Deactivated
          en: Deactivated
          description: "Status is true when the output is deactivated, cylinder is backward and Start sensor is on"
        - &ok
          swtag: bSts_Ok
          en: Ok
          description: Status of the CM is fine, no alarms are active
        - &unlocked
          swtag: bSts_Unlocked
          en: Unlocked
          description: "Command to CM are executed, used to protect against failures"
      alarm: &alarm_do
        - en: Both sensors on
        - en: Start Feedback sensor stays OFF
        - en: End Feedback sensor stays OFF
        - en: Start Feedback stays ON
        - en: End Feedback stays ON
    - &cm_lift
      btn: btn-lift
      status: &udtlift_sts
        LiftUp:
          swtag: bSts_LiftUp
        LiftDown:
          swtag: bSts_LiftDown
        DiskUp:
          swtag: bSts_DiskUp
        DiskDown:
          swtag: bSts_DiskDown
        IOtest:
          swtag: bSts_IOtest
        Unlocked:
          swtag: bSts_Unlocked
        HandleMounted:
          swtag: bSts_HandleMounted
      alarm: &udtlift_alm
        - swtag: bAlm_LiftSensorStartPositionStaysOn
        - swtag: bAlm_LiftSensorStartPositionStaysOff
        - swtag: bAlm_DiskSensorStartPositionStaysOn
        - swtag: DiskSensorStartPositionStaysOff
        - swtag: bAlm_DiskSensorEndPositionStaysOn
        - swtag: bAlm_DiskSensorEndPositionStaysOff
        - swtag: bAlm_BothDiskSensorsOn
        - swtag: bAlm_BothBlockageSensorsOn
        - swtag: bAlm_BlockageSensorStartPositionStaysOn
        - swtag: bAlm_BlockageSensorStartPositionStaysOff
        - swtag: bAlm_BlockageSensorEndPositionStaysOn
        - swtag: bAlm_BlockageSensorEndPositionStaysOff
        - en: Timeout up
        - en: Timeout down
      parameter: &lift_config
        par_time_out:
          hmi: Time out (ms)
          errors:
            - fou 1
            - fout 2
          teststep:
            - up
            - down
          description: denotes the time in milliseconds that is allowed between activation of the lift and the input signal that the lift has reached its destination.
          value: 5000
        par_vacuum_on:
          hmi: Vacuum on time (ms)
          description: denotes a wait time between switching the vacuum on and start moving up and moving down
          value: 50
        par_lift_up:
          hmi: Lift up time (ms)
          description: denotes the time the lift needs to be in his upper position.
          value: 100
        par_lift_down:
          hmi: Lift down time (ms)
          description: denotes the time that is needed to run down with the lift before vacuum is switched off and blow off is started. When this time is set longer than the time the lift needs to reach the sensor at the down position, this timer is switched off and vacuum will be set off and blow off will be activated upon reaching this sensor. 
          value: 1000
        par_vacuum_off:
          hmi: Vacuum off time (ms)
          value: 100
        par_blow_off:
          hmi: Blow off time (ms)
          description: indicates the length of time the vacuum is blown off. 
          value: 50
      command: &lift_command
        cmd_lift_up:
          en: Lift Up
          swtag: cmd_activate
        cmd_lift_down:
          en: Lift Down
          swtag: cmd_deactivate
        cmd_disk_up:
          en: Disk up
          swtag: bCmd_DiskUp
        cmd_disk_down:
          en: Disk down
          swtag: bCmd_DiskDown
        cmd_mount_handle:
          en: Mount handle
          swtag: bCmd_MountHandle
      input:
        InputLiftAtStartPos: &inputliftatstartpos
          swtag: udtSts_InputLiftAtStartPos
          # tag: B1
          nl: Lift laag
          en: Lift downwards
        InputDiskAtEndPos: &inputdiskatendpos # Schijf aanbeugelpositie hoog, op cilinder G1
          # tag: G1-B1
          # name: InputDiskAtEndPos
          type: I
          swtag: udtSts_InputDiskAtEndPos
          nl: Schijf hoog
          en: Disk up
        InputDiskAtStartPos: &inputdiskatstartpos              # Schijf aanbeugelpositie laag, op cilinder G1
          # tag: G1-B2
          # name: InputDiskAtStartPos
          type: I
          swtag: udtSts_InputDiskAtStartPos
          nl: Schijf laag
          en: Disk down
        InputBlockageAtStartPos: &inputblockageatstartpos             # Blokkade schijf aanbeugelpositie hoog, op cilinder G11
          # tag: G11-B1
          name: InputBlockageAtStartPos
          type: I
          swtag: udtSts_InputBlockageAtEndPos
          nl: Blokkade hoog
          en: Blockage up
        InputBlockageAtEndPos: &inputblockageatendpos             # Blokkade schijf aanbeugelpositie laag, op cilinder G11A
          # tag: G11-B2
          name: InputBlockageAtEndPos
          type: I
          swtag: udtSts_InputBlockageAtStartPos
          nl: Blokkade laag
          en: Blockage down
      output:
        OutputLiftActivate: &outputliftactivate # Lift op aanbeugelpositie Omhoog, ventiel E1
          swtag: udtSts_OutputLiftActivate
          nl: Lift omhoog
          en: Lift up
          <<: *vm
        OutputLiftDeactivate: &outputliftdeactivate # Cylinder E1 lift on mounting position up
          swtag: udtSts_OutputLiftDeactivate
          nl: Lift omlaag
          en: Lift down
          <<: *vm
        VacuumCupUp: &vacuumcupup # Vacuum op functie E1A, ventiel SVE1
          swtag: udtSts_VacuumCupUp
          <<: *vd
          nl: Vacuum op
          en: Vacuum cup up
        BlowOf: &blowof # Afblazen functie SVE1, ventiel SBE1
          swtag: udtSts_BlowOf
          en: Blow of
          nl: Afblazen
        VacuumOn: &vacuumon
          en: Vacuum
        OutputDiskActivate: &outputdiskactivate # OutputDiskActivate # Schijf aanbeugelpositie omhoog, ventiel G1
          swtag: udtSts_OutputDiskActivate
          nl: Schijf omhoog
          en: Disk up
          <<: *vj
        OutputDiskDeactivate: &outputdiskdeactivate # OutputDiskDeactivate # Schijf aanbeugelpositie omlaag, ventiel G1A
          swtag: udtSts_OutputDiskDeactivate
          nl: Schijf omlaag
          en: Disk down
        OutputBlockageActivate: &outputblockageactivate # OutputBlockageActivate # Blokkade schijf aanbeugelpositie omhoog, ventiel G11
          swtag: udtSts_OutputBlockageActivate
          <<: *vj
          nl: Blokkade omhoog
          en: Blockage up
        OutputBlockageDeactivate: &outputblockagedeactivate # OutputBlockageDeactivate # Blokkade schijf aanbeugelpositie omlaag, ventiel G11A
          swtag: udtSts_OutputBlockageDeactivate
          nl: Blokkade omlaag
          en: Blockage down
    - &cm_axis
      parameter: &axis_parameter
        - en: Home Enabled
          swtag: bCfg_HomeEnabled
          type: BOOL
          description: "Disable the Homing command in the HMI"
        - en: With Home Sensor1
          swtag: bCfgWithHomeSensor1
          type: BOOL
          description: "Cfg = 1 when one home sensor is available"
        - en: With Home Sensor2
          swtag: bCfgWithHomeSensor2
          type: BOOL
          description: "Cfg = 1 when the second home sensor is available (Used for double axis)"
        - en: Timeout Sec
          swtag: diCfg_TimeoutSec
          type: DINT
          description: "Timeout value for enable, home and move command."
      alarm: &axis_alarm
        - en: Enable Timeout
          swtag: bAlm_EnableTimeout
          type: BOOL
          description: "Alarm when enabling takes longer than expected"
        - en: Home Timeout
          swtag: bAlm_HomeTimeout
          type: BOOL
          description: "Alarm when the homing takes longer than expected"
        - en: Move Timeout
          swtag: bAlm_MoveTimeout
          type: BOOL
          description: "Alarm when moving takes longer than expected"
      command: &axis_command
        # HMI
        - en: On
          swtag: bCmd_On
          type: BOOL
          description: "Command to Enable the drive"
        - en: Off
          swtag: bCmd_Off
          type: BOOL
          description: "Command to Disable the drive"
        - en: Break release
          swtag: bCmd_BrakeRelease
          type: BOOL
          description: "Command to deactivate the motor brake"
        - en: Stop
          swtag: bCmd_Stop
          type: BOOL
          description: "Command to stop the motion"
        - en: Home
          swtag: bCmd_Home
          type: BOOL
          description: "Command to start the homing"
        - en: Move No # 0
          swtag: diCmd_MoveNo
          type: DINT
          description: "Command to Start a move"
        # Overig
        - en: Flying Measure Start
          swtag: bCmd_FlyingMeasureStart
          type: BOOL
          description: "Command to start the flying measure"
        - en: Flying Measure Stop
          swtag: bCmd_FlyingMeasureStop
          type: BOOL
          description: "Command to stop the flying measure"
        - en: Gear
          swtag: bCmd_Gear
          type: BOOL
          description: "Command to Gear the slave drives"
        - en: Start Reading Registration Input
          swtag: bCmd_StartReadingRegistrationInput
          type: BOOL
          description: "CMD = 1 servo starts reading the registration input positive edge position"
        - en: Stop Reading Registration Input
          swtag: bCmd_StopReadingRegistrationInput
          type: BOOL
          description: "CMD = 1 servo stops reading the registration input positive edge position"
        - en: Reset
          swtag: bCmd_Reset
          type: BOOL
          description: "Command to reset alarms"
        - en: Run With High Torque
          swtag: bCmd_RunWithHighTorque
          type: BOOL
          description: "Command to run with high torque when the machine is in Execute"
      info: &axis_info
        - en: Position
          swtag: rSts_ActualPosition
          type: REAL
          description: "Actual position"
        - en: Velocity
          swtag: rSts_ActualVelocity
          type: REAL
          description: "Actual velocity"
        - en: Last Move No
          swtag: diSts_LastActiveMoveNo
          type: DINT
          description: "Last active move number"
        - en: Move Complete
          swtag: diSts_MoveCompletedNo
          type: DINT
          description: "MoveNr is completed and at position"
        - en: Axis state 1
          swtag: diSts_CIPaxisState1
          type: DINT
          description: "Status of the Axis 1"
        - en: Axis state 2
          swtag: diSts_CIPaxisState2
          type: DINT
          description: "Status of the Axis 2"
        - en: Axis fault 1
          swtag: diSts_AxisFault1
          type: DINT
          description: "Axis 1 fault code"
        - en: Axis fault 2
          swtag: diSts_AxisFault2
          type: DINT
          description: "Axis 2 fault code"
      input: &axis_input
        - &home1
          en: Home sensor 1
          iotype: DI
          swtag: bInpHomeSensor1
          type: BOOL
          description: "State of home sensor 1"
        - &home2
          en: Home sensor 2
          iotype: DI
          swtag: bInpHomeSensor2
          type: BOOL
          description: "State of home sensor 2"
      status: &axis_status
        # HMI
        - en: Ok  
          swtag: bSts_Ok
          type: BOOL
          description: "No errors and warnings"
        - en: Moving  
          swtag: bSts_Moving
          type: BOOL
          description: "Status axis is moving"
        - en: Homed  
          swtag: bSts_Homed
          type: BOOL
          description: "Drive is Homed"
        - en: Enabled  
          swtag: bSts_Enabled
          type: BOOL
          description: "Drive is powered"
        - en: Unlocked  
          swtag: bSts_Unlocked
          type: BOOL
          description: "Command to CM are executed, use to protect for failures"
        - en: IOtest 
          swtag: bSts_IOtest
          type: BOOL
          description: "IOtest is active"

        # Overig
        - en: Drive Software Name  
          swtag: sDriveSoftwareName
          type: STRING
          description: "Servo drive software name"
        - en: Drive Firmware Version  
          swtag: diDriveFirmwareVersion
          type: DINT
          description: "Servo drive firmware version"
        - en: Flying Measure Status  
          swtag: diSts_FlyingMeasureStatus
          type: DINT
          description: "Flying measure status: 0=Off, 1=Started, 10=Busy, 11=Error."
        - en: Flying Measure Position  
          swtag: rSts_FlyingMeasurePosition
          type: REAL
          description: "Last flying measure position"
        - en: Flying Measure Count 
          swtag: diSts_FlyingMeasureCount
          type: DINT
          description: "Counter which count down each time a new measurement is taken"
        - en: Reading Registration Value  
          swtag: bSts_ReadingRegistrationValue
          type: BOOL
          description: "STS = 1 when the module is busy reading the registration value"
        - en: Actual Registration Value  
          swtag: rSts_ActualRegistrationValue
          type: BOOL
          description: "STS = the actual read registration position on a positive edge from registration input 1"
    - &axis_prop
      rPosition:
        data_type: REAL
        value: 0.0
        description: "Target Position or Distance to move"
      rSpeed:
        data_type: DINT
        value: 0
        description: "Speed in units/sec"
      rAcceleration:
        data_type: DINT
        value: 0
        description: "Acceleration in units/sec2"
      rDecceleration:
        data_type: DINT
        value: 0
        description: "Decceleration in units/sec2"
      diMoveType:
        data_type: DINT
        value: 0
        description: "0-6 are equal to the MAM command. 7 = MAJ Jog command."
      diJerk:
        data_type: DINT
        value: 0
        description: "Jerk Accel and Dccel parameter"
      bSetPositionLocked:
        data_type: BOOL
        value: false
        description: "Set position locked - 1 = setting could not be changed, 0 = setting could be changed"
      bSettingLocked:
        data_type: BOOL
        value: false
        description: "All settings are locked - 1 = setting could not be changed, 0 = setting could be changed"
    - &valvej
      valvatype: J
    - &do
      pre_sw: udtDo
      pre_par: udtRecipe
    - &lift_cmd
      - *activate
      - *deactivate
      - *pressure_less
      - *pressure_both

    - &axis_sts
      - *ok
      - *moving
      - *homed
      - *enabled
      - *unlocked
    - &axis_cmd
      - name: On
      - name: Off
      - name: Break release
      - name: Stop
      - name: Home
      - name: Move No # 0
    - &axis_info
      - name: Position
      - name: Velocity
      - name: Last Move No
      - name: Move Complete
      - name: Axis state 1
      - name: Axis state 2
      - name: Axis fault 1
      - name: Axis fault 2
      - name: Home sensor 1
        type: DI
      - name: Home sensor 2
        type: DI
    - &udtaxis
      status:
      - *ok
      - *moving
      - *homed
      - *enabled
      - *unlocked
      command:
      - name: On
      - name: Off
      - name: Break release
      - name: Stop
      - name: Home
      - name: Move No # 0
      info:
      - name: Position
      - name: Velocity
      - name: Last Move No
      - name: Move Complete
      - name: Axis state 1
      - name: Axis state 2
      - name: Axis fault 1
      - name: Axis fault 2
      - name: Home sensor 1
        type: DI
      - name: Home sensor 2
        type: DI

    - &udtdo
      parameter:
      - *activate_time
      - *deactivate_time
      command:
      - *activate
      - *deactivate
      status:
      - *activated
      - *deactivated
      - *ok
      - *unlocked
    # - &cm_l # L_BendHandle
    #   name: L_BendHandle
    #   swtag: udtDo_L_BendHandle
    #   input:
    #   - &l_b1 # Beugel uitbuigen voor, op cilinder L Bs.
    #     tag: L-B1
    #     name: InputEndFeedback
    #     type: I
    #     swtag: udtSts_InputEndFeedback
    #     nl: Beugel uitbuigen voor, op cilinder L Bs.
    #   - &l_b2 # Beugel uitbuigen retour, op cilinder L Bs.
    #     tag: L-B2
    #     name: InputStartFeedback
    #     type: I
    #     swtag: udtSts_InputStartFeedback
    #     nl: Beugel uitbuigen retour, op cilinder L Bs.
    #   output:
    #   - &l # Uitbuigen beugel, ventiel L
    #     tag: L
    #     <<: *vm
    #     name: ActivateOutput
    #     dir: O
    #     swtag: udtSts-ActivateOutput
    #     nl: Uitbuigen beugel, ventiel L
  unit: &unit
    properties:
      status:
        type: number
        description: Instellen status
        default: 0
        options:
        - Undefined
        - Run
    methods:
      name: setStatus
      description: Instellen status
      returns: new Status
      parameters:
      - name: status
        type: number
        description: Gewenste status
  cyl_nofb: # Cylinder with no feedback 
    parameter:
      - <<: *activate_time
      - <<: *deactivate_time
    command:
      - <<: *activate
      - <<: *deactivate
    status:
      - <<: *activated
      - <<: *deactivated
      - <<: *ok
      - <<: *unlocked
    input: []
    output:
      - <<: *active
  cyl_fb_end: 
    parameter:
      - <<: *time_out
      - <<: *deactivate_time
      - <<: *off_delay_time
    command:
      - <<: *activate
      - <<: *deactivate
    input:
      - <<: *feedback_end
      - <<: *no_start
    output:
      - <<: *active
    status:
      - <<: *activated
      - <<: *deactivated
      - <<: *ok
