        centring: &em_centring # Centering / Centrering
          tag: CE
          en: Centring
          nl: Centrering 
          program: P_EM_Centring # Tag wordt Program:P_EM_Centring 
          parameter:
            SearchMethod:
              en: Centring method
              swtag: dIdx_SearchMethod
              # parameter_tag: Program:P_EM_Centring.udtEm.arSettings
              # tag is {program}.udtEm.arSettings
              options:
                - tag: dSetDef_CentrMethodAtEarBlock
                - tag: dSetDef_CentrMethodAtHandleHole
                - tag: dSetDef_CentrMethodAtTamperEvident
                - tag: dSetDef_CentrMethodAtTamperEvidentHole
                - tag: dSetDef_CentrMethodDirect
                - tag: dSetDef_CentrMethodWithCodeReader
                - tag: dSetDef_CentrMethodWithCWL
                - name: Direct
                  description: Direct centring is only possible when the machine runs with Rectangular or Oval products. 
                    When this setting is selected the products are rotated to a position that is set up directly without searching a detection point on the pail. 
                - name: Earblock
                  description: centring the product is done by searching the Earblock.
                    When it is found the centring disk rotates to the end position with an offset that is set up by the user/operator 
            TamperEvidentInputOrient:
              swtag: dIdx_TamperEvidentInputOrient 
              en: Tamper evident input orientation
              description: 
                This setting is only visible when the machine is running with rectangualar or oval products. 
                This setting is used to ensure that the tamper evident ends in the right position after centring. 
                The user/operator should set up or the tamper evident is on the left or on the right when the pail runs into the machine. 
              options: *left_right
            StackOrientation:
              en: Stack Orientation # Tamper evident stacking orientation
              description: 
                This option should be selected by the user/operater to be sure the product ends 
                with the tamper evident in the right direction after centring. 
                This could be in the front or on the rear side depending on the customer wishes. 
              options: *front_rear
            MinDist:
              en: Minimum Distance handle hole vs code
              value: 100
              unit: mm
            CameraCheck:
              swtag: dIdx_CameraCheck
              en: Centring camera check # Niet aanwezig
              optional: true
              description: This setting has two options. 
                The two options are “on” or “Off”. 
                This option should be On when a product should be centred with a logo on the product 
                that always should end on the same position after centring. 
                When the option is On the camera checks a teached point on the product while he is centring, 
                and when the teached point is found the product rotates to the correct end position. 
              options: *on_off
            DelayForCameraCheck:
              swtag: dIdx_DelayForCameraCheck
              list: null
            CentringEndCheck:
              swtag: dIdx_CentringEndCheck
              options: *on_off
            MinReadDistance:
              swtag: dIdx_MinReadDistance
              type: number
            CentringWithTwoSensors:
              swtag: dIdx_CentringWithTwoSensors
              options: *on_off
            MaximumDistance:
              swtag: dIdx_MaximumDistance
              type: number
            AmountOfCheckSpots:
              swtag: dIdx_AmountOfCheckSpots
              type: number
            CodeCheck:
              swtag: dIdx_CodeCheck
              options: *on_off
          command:
            - en: Centring again
            - en: Teach Camera CWL
          input:
            AD32WB1: &ce_b1
              swtag: bInp_AD32WB1
              tag: CE.B1
              comp: AD32WB1
              en: Input at kinetix drive Axis 32 - Home sensor
            AD32WB2: &ce_b2
              swtag: bInp_AD32WB2
              tag: CE.B2
              comp: AD32WB2
              en: Input at kinetix drive Axis 32 - Earblock detection
            ProductAtCenteringPosition: &ce_b3 # Fotocel product bij centrering
              tag: CE.B3
              comp: AD38-B2
              name: ce_b3
              type: I
              swtag: udtInpDi_ProductAtCenteringPosition
              nl: Fotocel product bij centrering
            SignalCWLFound: &ce_b4 # Child Warning Label detected 
              tag: CE.B4
              swtag: udtDi_SignalCWLFound
              en: Signal (CWL) Child Warning Label detected 
              ch: sensor
          output:
            activate:
              swtag: udtDo_TeachCWLCamera
          cm:
            ad32: &cm_ad32  # As voor centreren
              <<: *cm_axis
              swtag: udtCp_Axis32_?????
              tag: SD32
              comp: AD32
              nl: Centreer as
              parameter:
                - en: Zero position (set)
                  description: 
                    is only used for centering Oval and Rectangular products. 
                    This is the position whereby the centering disk in line with the conveyor. 
                    Besides the position, the speed, acceleration and deceleration for this movement can be set.
                  distance: 447.5
                  speed: 400
                  accelaration: 600
                  decelaration: 600
                  jerk: 50
                  homing: 1
                - en: Search (fixed) position
                  description: is a fixed position but the speed, acceleration and deceleration can be set. These are used during searching the teached point on the pail (Earlock, Tamper evident or Handle hole). 
                - en: Search End position (calc)
                  description: is a fixed calculated end position value. This is the position the centring disks rotates to after finding the teached point. The speed, acceleration and deceleration that are used during this movement can be set.
                - en: Search End position offset (set)
                  description: is an offset value that is used to calculate the end position from move 3 after finding the teached position. Here only the distance setting is used. 
                - en: Direct End position (calc)
                  description: is a fixed calculated end position value. This is the position where the centring disk moves to when “Direct centring” is selected and the machine is running Oval / Rectangular products. The speed, acceleration and deceleration that are used during this movement can be set.
                - en: Direct End position (set)
                  description: is an offset value that is used to calculate the end position from move 5 after finding the teached position. Here only the distance setting is used. 
                - en: Zero position (calc)
              input:
                - &ad32_b2
                  swtag: bInp_Ad32B2
                  tag: SD32.B1
                  comp: AD32-B2
                - &ad32_b3
                  swtag: bInp_Ad32B3
                  tag: SD32.B2
                  comp: AD32-B3
            e5: &cm_e5    # Pos Handle-Fitting Lift
