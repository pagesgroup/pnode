  plc:
    - name: Pail Transport
      idle:
        - state: AX? gestopt
      execute:
        - wait: Vrijgave Infeed
        - wait: Vrijgave Centering
        - wait: Vrijgave Handle Fitting
        - wait: Vrijgave Intermediate Position (optioneel voor omrollen beugel)
        - wait: Vrijgave Stacking
        - step: AX? Stap Band
      execute_stack_drop:
        - wait: Vrijgave Infeed
        - wait: Vrijgave Centering
        - wait: Vrijgave Handle Fitting
        - wait: Vrijgave Intermediate Position (optioneel voor omrollen beugel)
        - wait: Vrijgave Stacking
        - step: AX? Stap Band op lage snelheid

    - name: Infeed Position
      idle:
        - state: C1 Hoog
        - state: E3 Laag
        - state: AX? uit (invoerband?)
      execute:
        - wait: Emmer tegen C1 blokkade (detectie fotocel)
        - step: E3 omhoog
        - step: AX? aan
        - step: C1 naar beneden
        - wait: Emmer op invoerpositie (detectie fotocel)
        - step: AX? stoppen
        - step: C1 omhoog
        - step: E3 naar beneden

    - name: Preparation Position
      idle: []
      execute: []

    - name: Centering Position
      idle:
        - state: Emmer op centreerpositie
        - state: E5 Laag/Uit
        - state: AX? gestopt
        - state: C11 Open (optioneel)
      execute:
        - step: C11 sluiten (pre-centreren emmer, optie voor ovale producten)
        - step: C11 openen
        - step: E5 lift omhoog
        - step: SV5 vacuüm uit
        - step: SB5 aan/uit & E5A omlaag
        - step: Start centrering AX?
        - wait: Centrering voltooid
        - step: SV5 aan & E5A omhoog
        - step: E5 lift omlaag
      notes:
        - Centrering met sensoren, eventuele camera's en nulpositie voor ovale/rechthoekige producten is een black box.

    - name: Handle Fitting Position
      idle:
        - state: Emmer op aanbeugelpositie (verificatie met fotocel)
        - state: E1 Laag
        - state: N1 Buiten
        - state: N2 Beneden
        - state: J0 Achter/Retour
        - state: U6 Achter/Retour
      execute:
        - step: E1 lift omhoog
        - step: N1 naar binnen
        - step: N2 omhoog
        - wait: Beugel in positie
        - step: J0 aandrukken beugel
        - step: J0 retour & N2 retour
        - step: N1 retour
        - step: U6 afstoten beugel naar voren
        - step: E1 lift omlaag & U6 naar achteren

    - name: Transport Handle Vertical
      idle:
        - state: Module biedt beugel aan
        - state: AD33 staat in pick-positie
        - state: UH1 beugeltransport achter/retour
        - state: U9 Hoog/In
        - state: U7 grijper open
      execute:
        - step: UH1 naar voren
        - step: U7 klem beugel dicht
        - step: U1 open (laat beugel los op module)
        - step: UH1 terug naar achteren
        - step: AD33 naar aanbeugelpositie (mount)
        - step: U9 omlaag
        - step: U7 klemmen los (open)
        - step: J0 aandrukken beugel (binnen)
        - step: J0 retour (buiten)
        - step: U9 omhoog
        - step: AD33 omhoog (pick)

    - name: Intermediate Position
      idle:
        - state: Emmer op tussenpositie
      execute:
        - step: Controle of beugel aangebeugeld is

    - name: Intermediate Position with Rolling around the Rim
      idle:
        - state: Emmer op tussenpositie
        - state: SD1 omrolplaat omhoog
        - state: SD2 omrollen open
      execute:
        - step: Controle of beugel aangebeugeld is
        - step: SD1 naar beneden
        - step: SD2 omrollen beugel sluiten
        - step: SD1 omrolplaat omhoog & SD2 open

    - name: Stacking Position
      idle:
        - state: Emmer op stapelpositie (verificatie met fotocel)
        - state: SE1 Hoog
        - state: SO gesloten met druk naar buiten/open (cilinder ingestuurd)
        - state: SR1 laag (stapelschijf ligt door zwaartekracht op SO)
      execute:
        - step: SE1 omlaag
        - step: SO gaat automatisch open via curvebanen en druk naar buiten
        - step: Stapelschijf komt door zwaartekracht op emmer te liggen en beweegt mee met de stapelcyclus
        - step: SO sluiten
        - step: SE1 omhoog
      execute_stack_drop:
        - wait: Stapelhoogte -1 product bereikt of schakelaar maximale stapelhoogte actief
        - step: SE1 omlaag
        - step: SO gaat automatisch open via curvebanen en druk naar buiten
        - step: SR1 omhoog om stapelschijf van stapel te tillen
        - wait: Fotocel detecteert dat het armpje van de stapelschijf wegdraait
        - step: Ventiel naar gesloten middenstand schakelen
        - state: Stapelschijf blijft net boven stapel staan
        - state: SE1 blijft omlaag & SO blijft open
      execute_new_stack:
        - state: SE1 beneden & SO open
        - wait: Emmer op stapelpositie
        - step: SR1 naar beneden (stapelschijf komt door zwaartekracht op emmer)
        - step: SO sluiten
        - step: SE1 omhoog
      execute_reject:
        - wait: Emmer op stapelpositie
        - step: Emmer niet stapelen

    - name: MH-BMF Baseplate
      idle:
        - state: T Laag
        - state: Z Achter
        - state: W Achter
        - state: S1 Retour
        - state: M1 Hoog
        - state: S9 Uit
        - state: A3L & A3R Open/Retour
        - state: A4L & A4R Open/Retour
        - state: P Open/Retour
      execute:
        - step: T omhoog
        - step: Z & W naar voren
        - step: S1 aandrukken staaf
        - step: T omlaag
        - step: Bewerkingsacties & Z naar achteren
      stations:
        - name: Staafmagazijn
          execute:
            - step: S9 Retour naar Uit (magazijnrollen draaien)
          notes:
            - Moment van aansturen S9 in cyclus nog onbekend.
        - name: Handvatstation
          execute: []
        - name: Kopstation Links
          execute:
            - step: A3L klemmen staaf links
            - step: A4L staaf stuiken links
            - step: A4L retour
            - step: A3L retour
        - name: Kopstation Rechts
          execute:
            - step: A3R klemmen staaf rechts
            - step: A4R staaf stuiken rechts
            - step: A4R retour
            - step: A3R retour
        - name: Haaksomstation
          execute:
            - step: P haaks om zetten
            - step: P retour

    - name: MH-BMF Forming Station
      idle:
        - state: Staaf op M1
        - state: M1 Hoog
        - state: I1 Retour (basisplaatzijde)
        - state: R Open (cilinder uit)
        - state: I2 Retour/Buiten
        - state: I3 Open (cilinder in)
        - state: K Retour
      execute:
        - step: M1 naar beneden
        - step: R klemmen staaf
        - step: I2 naar binnen (halve slag)
        - step: I1 naar voren
        - step: I3 sluiten/vergrendelen I1 & M1 omhoog
        - step: I2A naar binnen (volledige slag)
        - step: K doordrukken beugel
        - step: I2 retour/buiten & K retour
        - step: UV1 naar beneden
        - step: L naar buiten (uitbuigen beugel)
        - step: U1 klemmen beugel dicht
        - step: UV1 omhoog
        - step: I3 open/retour
        - step: I1 retour (naar basisplaat)

    - name: MH-BMF Transport Handle Horizontal
      idle:
        - state: Gevormde beugel op forming station
        - state: UH boven basisplaat
        - state: UV1 omhoog
        - state: L naar binnen
        - state: UR beugel horizontaal
        - state: U1 grijper open
      execute:
        - step: UV1 naar beneden
        - step: L naar buiten (uitbuigen beugel)
        - step: U1 klemmen beugel dicht
        - step: UV1 omhoog
        - step: L naar binnen
        - step: UR beugel roteren naar verticaal
        - step: UH beugelpakker naar overnamepositie
        - step: UH1 naar voren
        - step: U7 klemmen beugel dicht
        - step: U1 klemmen los (open)
        - step: UH naar boven basisplaat
        - step: UR naar beugel horizontaal

